<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки часовых поясов</title>
  <style>
    body {
      width: 350px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      color: #202124;
    }
    .info {
      font-size: 12px;
      color: #5f6368;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .timezone-list {
      list-style: none;
      padding: 0;
      margin: 0 0 16px 0;
    }
    .timezone-item {
      background: #f8f9fa;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: move;
      display: flex;
      align-items: center;
      user-select: none;
    }
    .timezone-item:hover {
      background: #e8eaed;
    }
    .timezone-item.dragging {
      opacity: 0.5;
    }
    .drag-handle {
      margin-right: 8px;
      color: #5f6368;
      font-size: 18px;
    }
    .timezone-name {
      flex: 1;
      font-size: 14px;
      color: #202124;
    }
    .buttons {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-save {
      background: #1a73e8;
      color: white;
    }
    .btn-save:hover {
      background: #1765cc;
    }
    .btn-reset {
      background: #f1f3f4;
      color: #202124;
    }
    .btn-reset:hover {
      background: #e8eaed;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    .status.success {
      background: #e6f4ea;
      color: #137333;
      display: block;
    }
    .status.error {
      background: #fce8e6;
      color: #c5221f;
      display: block;
    }
    .empty-state {
      text-align: center;
      padding: 24px;
      color: #5f6368;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>Порядок часовых поясов</h2>
  <div class="info">
    Перетащите часовые пояса, чтобы изменить их порядок отображения. Первый в списке будет отображаться слева.
  </div>
  <ul id="timezoneList" class="timezone-list"></ul>
  <div class="buttons">
    <button id="saveBtn" class="btn-save">Сохранить</button>
    <button id="resetBtn" class="btn-reset">Сбросить</button>
  </div>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
